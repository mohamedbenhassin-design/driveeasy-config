# Configuration de l'API Gateway (servie par le Config Server)
server:
  port: 8080

info:
  app:
    name: api-gateway
    description: Point d'entrée unique DriveEasy

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: vehicule-service
              uri: lb://vehicule-service
              predicates:
                - Path=/api/vehicules/**
              filters:
                - StripPrefix=1
            - id: client-service
              uri: lb://client-service
              predicates:
                - Path=/api/clients/**
              filters:
                - StripPrefix=1
            - id: location-service
              uri: lb://location-service
              predicates:
                - Path=/api/locations/**
              filters:
                - StripPrefix=1
          # Évite les en-têtes CORS dupliqués si un service en renvoie aussi
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
          # CORS : autorise le frontend Angular
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins: "http://localhost:4200"
                allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
                allowed-headers: "*"
                exposed-headers: X-Request-Id,X-Response-Time
                allow-credentials: true
                max-age: 3600
